
services:
  postgres:
    image: postgres:16
    container_name: ase_postgres
    environment:
      POSTGRES_DB: ase_etl
      POSTGRES_USER: ase_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ase_user -d ase_etl"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ase_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
